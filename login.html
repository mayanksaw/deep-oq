<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep OQ – Sign in</title>
<style>
  :root{
    --bg:#05060f; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.14);
    --text:#eef0ff; --muted:#9aa0c3; --a:#7c5cff; --b:#00d4ff; --c:#ff4fd8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  /* animated gradient orbs */
  .orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;animation:float 16s ease-in-out infinite}
  .o1{width:480px;height:480px;background:var(--a);top:-120px;left:-120px}
  .o2{width:420px;height:420px;background:var(--b);bottom:-140px;right:-100px;animation-delay:-5s}
  .o3{width:320px;height:320px;background:var(--c);top:45%;left:55%;animation-delay:-9s;opacity:.35}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.15)}66%{transform:translate(-40px,70px) scale(.92)}}
  #net{position:fixed;inset:0;z-index:1}

  .wrap{position:relative;z-index:2;width:min(420px,92vw);perspective:1000px}
  .card{
    background:var(--card); border:1px solid var(--border);
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border-radius:26px; padding:38px 34px 30px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
    transition:transform .15s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
  .card::before{ /* animated glowing border */
    content:"";position:absolute;inset:-1px;border-radius:27px;padding:1px;z-index:-1;
    background:conic-gradient(from var(--ang,0deg),transparent 0 70%,var(--b),var(--a),var(--c),transparent);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:spin 5s linear infinite;
  }
  @property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
  @keyframes spin{to{--ang:360deg}}

  .logo{
    width:64px;height:64px;margin:0 auto 16px;border-radius:20px;
    display:grid;place-items:center;font-weight:800;font-size:26px;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--a),var(--b));
    box-shadow:0 0 0 0 rgba(124,92,255,.6);animation:pulse 2.6s infinite;
  }
  @keyframes pulse{70%{box-shadow:0 0 0 22px rgba(124,92,255,0)}100%{box-shadow:0 0 0 0 rgba(124,92,255,0)}}
  h1{text-align:center;font-size:26px;letter-spacing:-.5px}
  h1 span{background:linear-gradient(90deg,var(--b),var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:shine 4s linear infinite}
  @keyframes shine{to{background-position:200% 0}}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 26px;min-height:20px}

  .field{position:relative;margin-bottom:16px;animation:rise .7s both}
  .field:nth-of-type(1){animation-delay:.15s}.field:nth-of-type(2){animation-delay:.25s}.field:nth-of-type(3){animation-delay:.35s}
  .field input{
    width:100%;padding:20px 46px 8px 16px;border-radius:14px;font-size:15px;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--border);outline:none;transition:.25s;
  }
  .field label{
    position:absolute;left:16px;top:16px;color:var(--muted);font-size:15px;pointer-events:none;transition:.2s;
  }
  .field input:focus,.field input:not(:placeholder-shown){padding-top:20px}
  .field input:focus+label,.field input:not(:placeholder-shown)+label{top:7px;font-size:11px;color:var(--b)}
  .field input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(124,92,255,.22);background:rgba(255,255,255,.08)}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
  .eye:hover{color:var(--text)}
  .name-field{display:none}
  .signup .name-field{display:block}

  .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:2px 0 20px}
  .row a{color:var(--b);text-decoration:none}.row a:hover{text-decoration:underline}
  .row label{display:flex;gap:7px;align-items:center;cursor:pointer}
  .signup .row{display:none}

  .btn{
    width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(90deg,var(--a),var(--b),var(--c));background-size:200% 100%;
    transition:transform .2s,box-shadow .2s,background-position .6s;position:relative;overflow:hidden;
    box-shadow:0 10px 30px rgba(124,92,255,.4);
  }
  .btn:hover{transform:translateY(-2px);background-position:100% 0;box-shadow:0 16px 40px rgba(0,212,255,.35)}
  .btn:active{transform:scale(.98)}
  .btn .spin{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;margin:0 auto}
  @keyframes r{to{transform:rotate(360deg)}}
  .btn.loading .t{display:none}.btn.loading .spin{display:block}

  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:22px 0 16px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
  .social{display:flex;gap:12px}
  .social button{
    flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);
    color:var(--text);font-size:14px;cursor:pointer;transition:.2s;
  }
  .social button:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
  .switch{text-align:center;font-size:14px;color:var(--muted);margin-top:22px}
  .switch a{color:var(--b);cursor:pointer;font-weight:600}
  .msg{font-size:13px;text-align:center;margin-top:12px;min-height:18px;color:#ff7a90}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  /* success overlay */
  .ok{position:absolute;inset:0;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,6,15,.92);opacity:0;pointer-events:none;transition:.5s;z-index:5}
  .ok.show{opacity:1;pointer-events:auto}
  .ok svg{width:90px;height:90px}
  .ok circle{stroke:var(--b);stroke-width:4;fill:none;stroke-dasharray:260;stroke-dashoffset:260}
  .ok path{stroke:#fff;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
  .ok.show circle{animation:draw .7s .1s forwards}.ok.show path{animation:draw .5s .7s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .ok h2{margin-top:16px}.ok p{color:var(--muted);margin-top:6px;font-size:14px}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<canvas id="net"></canvas>

<div class="wrap">
  <div class="card" id="card">
    <h1>Welcome to <span>Deep OQ</span></h1>
    <p class="sub" id="sub">Sign in to continue to your AI</p>

    <form id="form" novalidate>
      <div class="field name-field">
        <input id="name" type="text" placeholder=" " autocomplete="name"><label for="name">Full name</label>
      </div>
      <div class="field">
        <input id="email" type="email" placeholder=" " autocomplete="email"><label for="email">Email address</label>
      </div>
      <div class="field">
        <input id="pass" type="password" placeholder=" " autocomplete="current-password"><label for="pass">Password</label>
        <button type="button" class="eye" id="eye" aria-label="Show password">👁</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="btn" id="go" type="submit"><span class="t" id="goText">Sign in</span><div class="spin"></div></button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="divider">or continue with</div>
    <div class="social">
      <button type="button" data-p="Google">Google</button>
    </div>
    <p class="switch" id="switch">New here? <a id="toggle">Create an account</a></p>

    <div class="ok" id="ok">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="41"/><path d="M30 52 L45 66 L71 36"/></svg>
      <h2 id="okTitle">Welcome back!</h2><p>Launching Deep OQ…</p>
    </div>
  </div>
</div>

<script>
/* ===== Config: change this to your AI's main page ===== */
const AFTER_LOGIN_URL = "/";       // where to go after login
const API_URL = null;              // e.g. "/api/login" – set to use your real backend

/* ===== Particle network background ===== */
const cv = document.getElementById("net"), cx = cv.getContext("2d");
let W, H, pts = [], mouse = {x:-999,y:-999};
function resize(){W = cv.width = innerWidth; H = cv.height = innerHeight;
  pts = Array.from({length: Math.min(90, Math.floor(W*H/18000))}, () => ({
    x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5}));}
addEventListener("resize", resize); resize();
addEventListener("mousemove", e => {mouse.x = e.clientX; mouse.y = e.clientY;});
(function loop(){
  cx.clearRect(0,0,W,H);
  for (const p of pts){
    p.x += p.vx; p.y += p.vy;
    if (p.x<0||p.x>W) p.vx*=-1; if (p.y<0||p.y>H) p.vy*=-1;
    cx.beginPath(); cx.arc(p.x,p.y,1.6,0,6.28); cx.fillStyle="rgba(180,200,255,.8)"; cx.fill();
  }
  for (let i=0;i<pts.length;i++){
    for (let j=i+1;j<pts.length;j++){
      const d = Math.hypot(pts[i].x-pts[j].x, pts[i].y-pts[j].y);
      if (d<120){cx.strokeStyle=`rgba(124,160,255,${.25*(1-d/120)})`;cx.beginPath();
        cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.stroke();}
    }
    const m = Math.hypot(pts[i].x-mouse.x, pts[i].y-mouse.y);
    if (m<160){cx.strokeStyle=`rgba(0,212,255,${.5*(1-m/160)})`;cx.beginPath();
      cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(mouse.x,mouse.y);cx.stroke();}
  }
  requestAnimationFrame(loop);
})();

/* ===== 3D tilt on card ===== */
const card = document.getElementById("card");
document.addEventListener("mousemove", e => {
  const x = (e.clientX/innerWidth - .5), y = (e.clientY/innerHeight - .5);
  card.style.transform = `rotateY(${x*8}deg) rotateX(${-y*8}deg)`;
});

/* ===== Form logic ===== */
const $ = id => document.getElementById(id);
let signup = false;
$("switch").addEventListener("click", e => {
  if (e.target.tagName !== "A") return;
  signup = !signup;
  card.classList.toggle("signup", signup);
  $("goText").textContent = signup ? "Create account" : "Sign in";
  $("sub").textContent = signup ? "Create your Deep OQ account" : "Sign in to continue to your AI";
  $("switch").innerHTML = signup
    ? 'Already have an account? <a id="toggle">Sign in</a>'
    : 'New here? <a id="toggle">Create an account</a>';
  $("msg").textContent = "";
});
$("eye").onclick = () => {
  const p = $("pass"); const show = p.type === "password";
  p.type = show ? "text" : "password"; $("eye").textContent = show ? "🙈" : "👁";
};
function fail(t){ $("msg").textContent = t; card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }

document.querySelectorAll(".social button").forEach(b => b.onclick = () =>
  fail(b.dataset.p + " login needs to be connected to your backend."));

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("name").value.trim(), email = $("email").value.trim(), pass = $("pass").value;
  if (signup && name.length < 2) return fail("Please enter your name.");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail("Enter a valid email address.");
  if (pass.length < 6) return fail("Password must be at least 6 characters.");
  $("msg").textContent = ""; $("go").classList.add("loading");

  try{
    let user;
    if (API_URL){
      const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({mode: signup?"signup":"login", name, email, password: pass})});
      if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || "Login failed");
      user = await r.json();
    } else { // demo mode: stores users in this browser only
      await new Promise(r => setTimeout(r, 1100));
      const users = JSON.parse(localStorage.getItem("deepoq_users") || "{}");
      if (signup){
        if (users[email]) throw new Error("Account already exists. Please sign in.");
        users[email] = {name, pass: btoa(pass)};
        localStorage.setItem("deepoq_users", JSON.stringify(users));
      } else if (!users[email] || users[email].pass !== btoa(pass)){
        throw new Error("Wrong email or password.");
      }
      user = {name: users[email].name, email};
    }
    (($("remember").checked ? localStorage : sessionStorage)).setItem("deepoq_user", JSON.stringify(user));
    $("okTitle").textContent = (signup ? "Account created, " : "Welcome back, ") + (user.name || "friend") + "!";
    $("ok").classList.add("show");
    setTimeout(() => location.href = AFTER_LOGIN_URL, 2200);
  } catch(err){ fail(err.message); }
  finally{ $("go").classList.remove("loading"); }
});
</script>
</body>
</html>
