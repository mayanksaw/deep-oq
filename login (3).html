<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep OQ - Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0d14;
    --panel: #12151f;
    --line: #262b3d;
    --text: #e8eaf2;
    --muted: #8a90a6;
    --accent: #6c6cff;
    --ok: #3ee0c3;
    --bad: #ff6b81;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
  }
  #net { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .card {
    position: relative; z-index: 1;
    width: min(400px, 100%);
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 28px 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
  .card.shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo { width: 38px; height: 38px; flex: none; }
  .logo circle.ring { transform-origin: 50% 50%; animation: spin 14s linear infinite; }
  .logo circle.core { animation: pulse 2.4s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.25); opacity: .7; } }
  h1 { font: 700 26px/1.1 "Space Grotesk", system-ui, sans-serif; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; min-height: 20px; }

  .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tabs button { position: relative; z-index: 1; background: none; border: 0; color: var(--muted); font: 500 14px "Space Grotesk", system-ui, sans-serif; padding: 9px 0; cursor: pointer; transition: color .25s; border-radius: 9px; }
  .tabs button[aria-selected="true"] { color: var(--text); }
  .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--line); border-radius: 9px; transition: transform .35s cubic-bezier(.3,1.3,.5,1); }
  .tabs[data-mode="signup"] .pill { transform: translateX(100%); }

  .field { position: relative; margin-bottom: 14px; }
  .field input { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font-size: 15px; padding: 22px 44px 8px 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,108,255,.22); }
  .field label { position: absolute; left: 14px; top: 16px; color: var(--muted); font-size: 15px; pointer-events: none; transform-origin: left top; transition: transform .2s, color .2s; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { transform: translateY(-9px) scale(.76); }
  .field input:focus + label { color: var(--accent); }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; background: none; border: 0; color: var(--muted); cursor: pointer; border-radius: 8px; display: grid; place-items: center; }
  .eye:hover { color: var(--text); }

  .confirm { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease, opacity .35s; opacity: 0; }
  .confirm > div { overflow: hidden; }
  .tabs[data-mode="signup"] ~ form .confirm { grid-template-rows: 1fr; opacity: 1; }

  .msg { min-height: 20px; font-size: 13.5px; margin: 2px 0 12px; color: var(--muted); }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }

  .go { width: 100%; position: relative; overflow: hidden; background: var(--accent); color: #fff; border: 0; border-radius: 12px; font: 700 15px "Space Grotesk", system-ui, sans-serif; padding: 13px; cursor: pointer; transition: transform .15s, filter .2s; }
  .go:hover { filter: brightness(1.1); }
  .go:active { transform: scale(.98); }
  .go:disabled { cursor: progress; filter: saturate(.7); }
  .go .spin { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; margin: 0 auto; animation: spin .7s linear infinite; }
  .go.loading .label { display: none; }
  .go.loading .spin { display: block; }
  .go.done { background: var(--ok); color: #06251f; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas id="net" aria-hidden="true"></canvas>

<main class="card" id="card">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle class="ring" cx="20" cy="20" r="16" fill="none" stroke="#6c6cff" stroke-width="2" stroke-dasharray="6 5"/>
      <circle cx="20" cy="20" r="9" fill="none" stroke="#3ee0c3" stroke-width="1.5" opacity=".7"/>
      <circle class="core" cx="20" cy="20" r="4" fill="#6c6cff"/>
    </svg>
    <h1>Deep OQ</h1>
  </div>
  <p class="sub" id="sub">Log in to pick up your chats.</p>

  <div class="tabs" id="tabs" data-mode="login" role="tablist">
    <span class="pill"></span>
    <button type="button" role="tab" aria-selected="true" data-mode="login">Log in</button>
    <button type="button" role="tab" aria-selected="false" data-mode="signup">Sign up</button>
  </div>

  <form id="form" novalidate>
    <div class="field">
      <input id="u" name="username" type="text" placeholder=" " autocomplete="username" autocapitalize="none" required>
      <label for="u">Username</label>
    </div>
    <div class="field">
      <input id="p" name="password" type="password" placeholder=" " autocomplete="current-password" required>
      <label for="p">Password</label>
      <button class="eye" type="button" id="eye" aria-label="Show password">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="confirm"><div>
      <div class="field">
        <input id="c" type="password" placeholder=" " autocomplete="new-password" tabindex="-1">
        <label for="c">Confirm password</label>
      </div>
    </div></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <button class="go" id="go" type="submit"><span class="label" id="label">Log in</span><span class="spin"></span></button>
  </form>
</main>

<script>
/* ---- Settings: change these to match your server ---- */
const LOGIN_URL  = "/api/login";     // POST {username, password} -> {token}
const SIGNUP_URL = "/api/register";  // POST {username, password} -> {token}
const REDIRECT_TO = "/";             // the chat page
const TOKEN_KEY  = "t";              // sessionStorage key the chat page reads

/* ---- Mode switch (Log in / Sign up) ---- */
const tabs = document.getElementById("tabs");
const sub = document.getElementById("sub");
const label = document.getElementById("label");
const pw = document.getElementById("p");
const confirmInput = document.getElementById("c");
const msg = document.getElementById("msg");
let mode = "login";

function setMode(next) {
  mode = next;
  tabs.dataset.mode = next;
  tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === next));
  const signup = next === "signup";
  sub.textContent = signup ? "Create an account to save your chats and memory." : "Log in to pick up your chats.";
  label.textContent = signup ? "Create account" : "Log in";
  pw.autocomplete = signup ? "new-password" : "current-password";
  confirmInput.tabIndex = signup ? 0 : -1;
  say("");
}
tabs.addEventListener("click", e => { const b = e.target.closest("button"); if (b) setMode(b.dataset.mode); });

document.getElementById("eye").addEventListener("click", e => {
  const show = pw.type === "password";
  pw.type = show ? "text" : "password";
  confirmInput.type = pw.type;
  e.currentTarget.setAttribute("aria-label", show ? "Hide password" : "Show password");
});

function say(text, kind) { msg.textContent = text; msg.className = "msg" + (kind ? " " + kind : ""); }
function fail(text) {
  say(text, "err");
  const card = document.getElementById("card");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
}

/* ---- Submit ---- */
const form = document.getElementById("form");
const go = document.getElementById("go");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const username = document.getElementById("u").value.trim();
  const password = pw.value;
  if (!username || !password) return fail("Enter your username and password.");
  if (mode === "signup") {
    if (password.length < 8) return fail("Use a password with at least 8 characters.");
    if (password !== confirmInput.value) return fail("The passwords don't match.");
  }
  go.disabled = true; go.classList.add("loading"); say("");
  try {
    const res = await fetch(mode === "signup" ? SIGNUP_URL : LOGIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ username, password })
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error(data.error || data.message || (res.status === 429 ? "Too many attempts. Wait a few minutes." : "Something went wrong. Try again."));
    if (data.token) { try { localStorage.setItem(TOKEN_KEY, data.token); } catch (_) {} }
    go.classList.remove("loading"); go.classList.add("done");
    label.textContent = mode === "signup" ? "Account created" : "Logged in";
    say("Opening your chats...", "ok");
    surge();
    setTimeout(() => { location.href = REDIRECT_TO; }, 900);
  } catch (err) {
    go.classList.remove("loading"); go.disabled = false;
    fail(err.message || "Can't reach the server. Check your connection.");
  }
});

/* ---- Background: drifting network that follows the cursor ---- */
const cv = document.getElementById("net");
const ctx = cv.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, dpr, nodes = [], mouse = { x: -999, y: -999 }, boost = 1;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.min(90, Math.round(W * H / 14000));
  nodes = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
    r: Math.random() * 1.6 + .8
  }));
}
function surge() { boost = 6; }
addEventListener("resize", resize);
addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("pointerleave", () => { mouse.x = mouse.y = -999; });

function frame() {
  ctx.clearRect(0, 0, W, H);
  boost += (1 - boost) * .03;
  for (const a of nodes) {
    a.x += a.vx * boost; a.y += a.vy * boost;
    if (a.x < 0 || a.x > W) a.vx *= -1;
    if (a.y < 0 || a.y > H) a.vy *= -1;
    const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
    ctx.fillStyle = dm < 160 ? "#3ee0c3" : "rgba(138,144,166,.7)";
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.283); ctx.fill();
    if (dm < 160) {
      ctx.strokeStyle = `rgba(62,224,195,${(1 - dm / 160) * .7})`;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
    }
  }
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) {
        ctx.strokeStyle = `rgba(108,108,255,${(1 - d / 130) * .35})`;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }
  if (!still) requestAnimationFrame(frame);
}
resize(); frame();
</script>
</body>
</html>
